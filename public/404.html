<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>
  <meta name="robots" content="noindex" />
  <script>
    // GitHub Pages + Next.js basePath 修复：
    // next/link 已自动拼接 basePath，但客户端路由失败回退到 404 时
    // GitHub Pages 可能再次拼路径导致 /Agora.ai/Agora.ai/...
    // 此脚本检测并自动重定向到正确路径
    (function () {
      var path = location.pathname;
      var BASE = "/Agora.ai";
      // Case 1: double basePath, e.g. /Agora.ai/Agora.ai/chat
      var double = BASE + BASE + "/";
      if (path.indexOf(double) === 0) {
        // Correct: /Agora.ai/chat (+search/hash)
        var correct = BASE + path.substring(double.length - 1);
        location.replace(correct + location.search + location.hash);
        return;
      }
      // Case 2: just /Agora.ai/Agora.ai (no trailing slash after)
      if (path === BASE + BASE || path === BASE + BASE + "/") {
        location.replace(BASE + "/" + location.search + location.hash);
        return;
      }
      // Case 3: the page is legitimately missing - redirect to homepage
      setTimeout(function () {
        location.replace(BASE + "/");
      }, 1500);
    })();
  </script>
</head>
<body style="background:#000;color:#999;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">
  <p>Redirecting to correct page… 正在跳转到正确页面…</p>
</body>
</html>
