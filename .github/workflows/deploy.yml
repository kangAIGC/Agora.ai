name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '9.0.0'

      - name: Install dependencies
        run: pnpm install --prefer-frozen-lockfile --prefer-offline

      - name: Build static site
        run: pnpm next build
        env:
          COZE_PROJECT_ENV: PROD
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_TOS_BASE_URL: ${{ secrets.NEXT_PUBLIC_TOS_BASE_URL }}

      - name: Rewrite local asset URLs to TOS
        run: node scripts/rewrite-tos-urls.mjs
        env:
          NEXT_PUBLIC_TOS_BASE_URL: ${{ secrets.NEXT_PUBLIC_TOS_BASE_URL }}

      - name: Generate GitHub Pages 404.html（消除冷启动 404 闪屏）
        run: node scripts/generate-gh-pages-404.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
